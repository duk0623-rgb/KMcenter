<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR MFBF 교대 단안 홱보기 마스터 V13.0</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    #control-panel {
      position: absolute; top: 15px; left: 15px; z-index: 99999;
      background: rgba(11, 15, 26, 0.95); color: white; padding: 22px;
      border-radius: 12px; border: 1px solid #3b82f6; width: 290px;
      max-height: 85vh; overflow-y: auto;
    }
    .panel-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #3b82f6; padding-bottom: 8px; }
    .panel-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; font-weight: bold; }
    select, input[type="range"] { width: 100%; padding: 8px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
    .display-value { float: right; color: #38bdf8; font-weight: bold; }
    .btn { width: 100%; padding: 11px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 14px; }
    #start-btn { background: #22c55e; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
    #score-board { position: fixed; top: 20px; right: 20px; z-index: 99999; background: rgba(15, 23, 42, 0.95); color: #22c55e; padding: 15px 22px; border-radius: 8px; border: 2px solid #22c55e; font-family: monospace; font-size: 16px; width: 240px; }
    .exit-vr-btn { width: 100%; background: #ef4444; color: white; border: none; border-radius: 4px; padding: 6px 10px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 8px; display: none; }
    #result-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100000; background: rgba(11, 16, 26, 0.98); color: white; padding: 35px 50px; border-radius: 15px; border: 3px solid #38bdf8; text-align: center; }
    #result-modal h1 { color: #38bdf8; margin-top: 0; }
    #result-modal .final-score { font-size: 42px; color: #eab308; margin: 20px 0; font-weight: bold; }
    #result-modal .reset-btn { background: #38bdf8; color: #000; padding: 10px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .radio-group { display: flex; gap: 10px; margin-top: 4px; }
    .radio-label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #cbd5e1; cursor: pointer; }
  </style>
  
  <script>
    AFRAME.registerComponent('stereo-eye-lock', {
      schema: { eye: {type: 'string', default: 'both'} },
      init: function () {
        this.layerMask = (this.data.eye === 'left') ? 1 : (this.data.eye === 'right' ? 2 : 0);
        this.el.addEventListener('object3dset', () => { this.applyLayer(); });
        this.applyLayer();
      },
      applyLayer: function () {
        const obj = this.el.getObject3D('mesh') || this.el.object3D;
        if (obj) {
          obj.layers.set(this.layerMask);
          obj.traverse(child => { if(child.layers) child.layers.set(this.layerMask); });
        }
      }
    });
  </script>
</head>
<body>

  <div id="control-panel">
    <div class="panel-title">🧠 MFBF 교대 단안 훈련 V13</div>
    
    <div class="panel-group">
      <label>⚙️ 시스템 제어 방식</label>
      <div style="font-size: 12px; color: #38bdf8; background: rgba(56,189,248,0.1); padding: 8px; border-radius: 6px; line-height: 1.4;">
        빨강(좌안) ↔ 초록(우안) 풍선이 시야 범위 내 무작위 위치에서 교대로 출현합니다.
      </div>
    </div>

    <div class="panel-group">
      <label>⏰ 총 훈련 시간 설정</label>
      <select id="training-time-select">
        <option value="60">1분 (테스트용)</option>
        <option value="300">5분 (기본 안구운동)</option>
        <option value="600" selected>10분 (정밀 집중)</option>
      </select>
    </div>

    <div class="panel-group">
      <label>↔️ 무작위 발생 시야 반경 <span class="display-value" id="range-txt">1.50</span></label>
      <input type="range" id="range-slider" min="0.50" max="2.50" value="1.50" step="0.10">
    </div>

    <div class="panel-group">
      <label>🔄 배경 직선 회전 속도 <span class="display-value" id="bg-speed-txt">2</span></label>
      <input type="range" id="bg-speed-slider" min="0" max="60" value="2" step="1">
    </div>
    
    <button id="start-btn" class="btn" onclick="startFusionTraining()">▶️ 안구 운동 시작</button>
  </div>

  <div id="score-board">
    <div style="color: #ef4444; font-size: 18px; margin-bottom: 5px;">TIME: <span id="val-time">00:00</span></div>
    <div style="color: #eab308; font-size: 13px; font-weight: bold; margin-bottom: 4px;">활성 타겟: <span id="active-eye-txt" style="color:#ff2a2a;">왼쪽눈 (빨강)</span></div>
    <div>SCORE: <span id="val-score">0000</span></div>
    <div style="color: #cbd5e1; font-size: 11px; margin-top: 4px;" id="status-txt">준비 버튼을 누르세요.</div>
    <button id="exit-vr-control" class="exit-vr-btn" onclick="exitVRModeManually()">🔴 훈련 중단 및 복귀</button>
  </div>

  <div id="result-modal">
    <h1>🎉 안구운동 프로그램 완료 🎉</h1>
    <p style="color: #aaa; margin: 0;">종료 팡파르와 함께 훈련이 완료되었습니다.</p>
    <div class="final-score"><span id="modal-final-score">0</span> 점</div>
    <button class="reset-btn" onclick="location.reload()">처음으로</button>
  </div>

  <a-scene background="color: #000000" vr-mode-ui="enabled: true">
    <a-assets>
      <canvas id="bgCheckerCanvas" width="512" height="512"></canvas>
    </a-assets>

    <a-entity id="cameraRig">
      <a-entity id="mainCamera" camera look-controls position="0 1.6 0">
        <a-entity id="centerFixationRay" raycaster="objects: .clickable-balloon; far: 10; interval: 20;"></a-entity>
        <a-ring radius-inner="0.02" radius-outer="0.03" color="#ffffff" position="0 0 -1" material="shader: flat; opacity: 0.6; depthTest: false;"></a-ring>
      </a-entity>
    </a-entity>

    <a-sky id="rotating-bg" src="#bgCheckerCanvas" radius="50" material="shader: flat; repeat: 16 16; side: back;" stereo-eye-lock="eye: both"></a-sky>

    <a-entity id="magic-eye-board" visible="true">
      
      <a-entity id="left-eye-container" class="clickable-balloon" stereo-eye-lock="eye: left">
        <a-sphere id="balloon-left" color="#ff2a2a" material="roughness: 0.15; metalness: 0.2;">
          <a-cone id="cone-left" radius-top="0.01" color="#cc1111"></a-cone>
        </a-sphere>
      </a-entity>
      
      <a-entity id="right-eye-container" class="clickable-balloon" stereo-eye-lock="eye: right">
        <a-sphere id="balloon-right" color="#10b981" material="roughness: 0.15; metalness: 0.2;">
          <a-cone id="cone-right" radius-top="0.01" color="#047857"></a-cone>
        </a-sphere>
      </a-entity>
      
    </a-entity>

    <a-entity id="particle-group"></a-entity>
  </a-scene>

  <script>
    const bgCanvas = document.getElementById('bgCheckerCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const bSize = 512; const bRows = 4; const bCols = 4;
    const bW = bSize / bCols; const bH = bSize / bRows;
    for (let r = 0; r < bRows; r++) {
      for (let c = 0; c < bCols; c++) {
        bgCtx.fillStyle = ((r + c) % 2 === 0) ? '#FFFFFF' : '#000000';
        bgCtx.fillRect(c * bW, r * bH, bW, bH);
      }
    }

    let audioCtx = null; let score = 0; let randomRange = 1.50; 
    let rotationSpeed = 2; let bgAngle = 0; let isTrainingActive = false; let isPopping = false; 

    let elapsedInterval = null; let totalSecondsElapsed = 0; let targetSeconds = 600;      
    
    // 현재 터뜨려야 할 활성 타겟 순서 ("left" = 빨강풍선, "right" = 초록풍선)
    let activeTurn = "left"; 
    let currentX = 0, currentY = 1.6;

    function getFixedZ() { return -3.0; } // 무작위 도약을 위한 깊이

    document.getElementById('range-slider').addEventListener('input', (e) => {
      randomRange = parseFloat(e.target.value);
      document.getElementById('range-txt').innerText = randomRange.toFixed(2);
      if(isTrainingActive) { renderAlternatingTargets(); }
    });
    document.getElementById('bg-speed-slider').addEventListener('input', (e) => {
      rotationSpeed = parseInt(e.target.value);
      document.getElementById('bg-speed-txt').innerText = rotationSpeed;
    });

    // [전면 개조 핵심] 단안 무작위 위치 생성 및 교대 시각화 제어 함수
    function renderAlternatingTargets() {
      if (!isTrainingActive) return;

      let targetZ = getFixedZ(); 
      let radiusRadius = 0.24; 

      // VR 헤드셋의 적정 시야범위 내 완전 랜덤 위치 산출 (X축, Y축 중심값 기준 분산)
      // 원장님이 설정하시는 슬라이더(randomRange)에 따라 도약 범위 확장 가능
      let randX = (Math.random() - 0.5) * (randomRange * 2);
      let randY = 1.6 + (Math.random() - 0.5) * (randomRange * 1.5); 

      // 안전 시야 한계선 보정 (Y축이 바닥 밑으로 가거나 너무 높이 뜨는 것 방지)
      if (randY < 0.6) randY = 0.6;
      if (randY > 2.8) randY = 2.8;

      currentX = randX;
      currentY = randY;

      const cLeft = document.getElementById('left-eye-container');
      const cRight = document.getElementById('right-eye-container');
      
      const bLeft = document.getElementById('balloon-left');
      const bRight = document.getElementById('balloon-right');
      const coneLeft = document.getElementById('cone-left');
      const coneRight = document.getElementById('cone-right');

      // 턴에 따라 한쪽 풍선만 활성화하고 반대쪽은 보이지 않게 처리하며 좌표 이동
      if (activeTurn === "left") {
        document.getElementById('active-eye-txt').innerText = "왼쪽눈 (빨강)";
        document.getElementById('active-eye-txt').style.color = "#ff2a2a";

        cLeft.setAttribute('visible', 'true');
        cRight.setAttribute('visible', 'false');

        bLeft.setAttribute('position', `${randX} ${randY} ${targetZ}`);
        bLeft.setAttribute('radius', radiusRadius);
        coneLeft.setAttribute('position', `0 ${-radiusRadius * 1.1} 0`);
        coneLeft.setAttribute('radius-bottom', `${radiusRadius * 0.15}`);
        coneLeft.setAttribute('height', `${radiusRadius * 0.25}`);
      } 
      else {
        document.getElementById('active-eye-txt').innerText = "오른쪽눈 (초록)";
        document.getElementById('active-eye-txt').style.color = "#10b981";

        cLeft.setAttribute('visible', 'false');
        cRight.setAttribute('visible', 'true');

        bRight.setAttribute('position', `${randX} ${randY} ${targetZ}`);
        bRight.setAttribute('radius', radiusRadius);
        coneRight.setAttribute('position', `0 ${-radiusRadius * 1.1} 0`);
        coneRight.setAttribute('radius-bottom', `${radiusRadius * 0.15}`);
        coneRight.setAttribute('height', `${radiusRadius * 0.25}`);
      }
    }

    function setupVRHardwareLayers() {
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('enter-vr', () => {
        const camera = sceneEl.camera;
        if (camera && camera.isArrayCamera) {
          camera.cameras[0].layers.enable(1); camera.cameras[0].layers.disable(2);
          camera.cameras[1].layers.enable(2); camera.cameras[1].layers.disable(1);
        }
      });
    }

    // 레이캐스터(컨트롤러/포인터 조준) 충돌 체크 로직
    function checkTargetFixation() {
      requestAnimationFrame(checkTargetFixation);
      if (!isTrainingActive || isPopping) return; 

      const raycasterEl = document.getElementById('centerFixationRay');
      if (!raycasterEl) return;

      let raycasterComponent = raycasterEl.components.raycaster;
      if (raycasterComponent && raycasterComponent.intersections && raycasterComponent.intersections.length > 0) {
        
        // 현재 활성화된 눈 레이어의 풍선을 짚었는지 정밀 대조 확인
        let intersectedEl = raycasterComponent.intersections[0].el;
        let intersectedId = intersectedEl.getAttribute('id');
        
        if ((activeTurn === "left" && (intersectedId === "left-eye-container" || intersectedId === "balloon-left")) ||
            (activeTurn === "right" && (intersectedId === "right-eye-container" || intersectedId === "balloon-right"))) {
          
          isPopping = true; 
          popTargetSuccess();
        }
      }
    }

    function popTargetSuccess() {
      playPopSound(); 
      score += 1000;
      document.getElementById('val-score').innerText = score.toString().padStart(4, '0');

      // 파티클 방출 효과 연동
      triggerParticlesEmission(currentX, currentY, getFixedZ(), 20);
      
      // 양안 교대 스위칭 연산
      activeTurn = (activeTurn === "left") ? "right" : "left";

      // 숨겼다가 다음 랜덤 위치에 재배치하는 0.4초 인터벌 딜레이 적용
      document.getElementById('magic-eye-board').setAttribute('visible', 'false');

      setTimeout(() => {
        if (!isTrainingActive) return;
        isPopping = false;
        renderAlternatingTargets(); 
        document.getElementById('magic-eye-board').setAttribute('visible', 'true'); 
      }, 400); 
    }

    function animateBackground() {
      requestAnimationFrame(animateBackground);
      if (rotationSpeed > 0 && isTrainingActive) {
        bgAngle += (rotationSpeed * 0.005); 
        const sky = document.getElementById('rotating-bg');
        if (sky) sky.setAttribute('rotation', `0 ${bgAngle * 57.3} 0`);
      }
    }

    function startElapsedClock() {
      if (elapsedInterval) clearInterval(elapsedInterval);
      totalSecondsElapsed = 0;
      document.getElementById('status-txt').innerText = "훈련 진행 중...";
      
      elapsedInterval = setInterval(() => {
        if (!isTrainingActive) return;
        totalSecondsElapsed++;
        
        let min = Math.floor(totalSecondsElapsed / 60); let sec = totalSecondsElapsed % 60;
        document.getElementById('val-time').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        
        if (totalSecondsElapsed >= targetSeconds) { 
          clearInterval(elapsedInterval); 
          playFanfareAndFinish(); 
        }
      }, 1000);
    }

    function playFanfareAndFinish() {
      isTrainingActive = false;
      document.getElementById('magic-eye-board').setAttribute('visible', 'false');
      document.getElementById('exit-vr-control').style.display = 'none';
      
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, index) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }, index * 120);
      });

      setTimeout(() => {
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.is('vr-mode')) sceneEl.exitVR();
        document.getElementById('modal-final-score').innerText = score;
        document.getElementById('result-modal').style.display = 'block';
      }, 1200);
    }

    function playPopSound() {
      if (!audioCtx) return;
      const osc1 = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
      osc1.type = 'sine'; osc1.frequency.setValueAtTime(440, audioCtx.currentTime); osc1.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc1.connect(gainNode); gainNode.connect(audioCtx.destination);
      osc1.start(); osc1.stop(audioCtx.currentTime + 0.12);
    }

    function triggerParticlesEmission(x, y, z, count) {
      const pGroup = document.getElementById('particle-group');
      for (let i = 0; i < count; i++) {
        const p = document.createElement('a-box');
        p.setAttribute('width', '0.04'); p.setAttribute('height', '0.04'); p.setAttribute('depth', '0.04');
        const colors = ['#ff0055', '#ffff00', '#00ffcc', '#38bdf8'];
        p.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]); p.setAttribute('position', `${x} ${y} ${z}`);
        const vx = (Math.random() - 0.5) * 3; const vy = (Math.random() - 0.5) * 3 + 1.2; const vz = (Math.random() - 0.5) * 3;
        pGroup.appendChild(p);
        let age = 0;
        const t = setInterval(() => {
          age += 16;
          let cx = x + vx * (age/1000); let cy = y + vy * (age/1000) - (0.5 * 9.8 * (age/1000)*(age/1000)); let cz = z + vz * (age/1000);
          p.setAttribute('position', `${cx} ${cy} ${cz}`);
          if (age > 800) { clearInterval(t); if (p.parentNode) p.parentNode.removeChild(p); }
        }, 16);
      }
    }

    function exitVRModeManually() {
      isTrainingActive = false; isPopping = false;
      if (elapsedInterval) clearInterval(elapsedInterval);
      document.getElementById('magic-eye-board').setAttribute('visible', 'false');
      document.getElementById('control-panel').style.display = 'block';
      document.getElementById('exit-vr-control').style.display = 'none';
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl && sceneEl.is('vr-mode')) sceneEl.exitVR();
    }

    function startFusionTraining() {
      isTrainingActive = true; isPopping = false;
      targetSeconds = parseInt(document.getElementById('training-time-select').value);
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      document.getElementById('control-panel').style.display = 'none';
      document.getElementById('exit-vr-control').style.display = 'block';
      
      activeTurn = "left"; 
      document.getElementById('magic-eye-board').setAttribute('visible', 'true');
      renderAlternatingTargets(); 
      startElapsedClock();
      
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl.hasLoaded) { sceneEl.enterVR(); } else { sceneEl.addEventListener('loaded', () => { sceneEl.enterVR(); }); }
    }

    setupVRHardwareLayers();
    animateBackground();
    requestAnimationFrame(checkTargetFixation);
  </script>
</body>
</html>
