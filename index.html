<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 양안시 통합 재활 시스템 V9.34 (2D 배경 최적화본)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0a1128; font-family: sans-serif; user-select: none; }
    #control-panel {
      position: absolute; top: 15px; left: 15px; z-index: 99999;
      background: rgba(11, 15, 26, 0.96); color: white; padding: 22px;
      border-radius: 12px; border: 1px solid #3b82f6; width: 280px;
    }
    .panel-title { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #3b82f6; padding-bottom: 8px; letter-spacing: 0.5px; }
    .panel-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; font-weight: bold; }
    select, input[type="range"] { width: 100%; padding: 8px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
    .display-value { float: right; color: #38bdf8; font-weight: bold; }
    .btn { width: 100%; padding: 11px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 14px; }
    #start-btn { background: #22c55e; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
    #score-board { position: fixed; top: 20px; right: 20px; z-index: 99999; background: rgba(15, 23, 42, 0.95); color: #22c55e; padding: 15px 22px; border-radius: 8px; border: 2px solid #22c55e; font-family: monospace; font-size: 15px; }
    .exit-vr-btn { width: 100%; background: #ef4444; color: white; border: none; border-radius: 4px; padding: 6px 10px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 8px; display: none; }
    #result-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100000; background: rgba(11, 15, 26, 0.98); color: white; padding: 35px 50px; border-radius: 15px; border: 3px solid #38bdf8; text-align: center; }
    .final-score { font-size: 42px; color: #eab308; margin: 20px 0; font-weight: bold; }
    .reset-btn { background: #38bdf8; color: #000; padding: 10px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .mode-selector { background: #1d4ed8 !important; }
  </style>
  
  <script>
    AFRAME.registerComponent('stereo-eye-lock', {
      schema: { eye: {type: 'string', default: 'both'} },
      init: function () {
        this.layerMask = (this.data.eye === 'left') ? 1 : (this.data.eye === 'right' ? 2 : 0);
        this.el.addEventListener('object3dset', () => { this.applyLayer(); });
        this.applyLayer();
      },
      applyLayer: function () {
        const obj = this.el.getObject3D('mesh') || this.el.object3D;
        if (obj) {
          obj.layers.set(this.layerMask);
          obj.traverse(child => { if(child.layers) child.layers.set(this.layerMask); });
        }
      }
    });

    // 하드웨어 독립형 단독 회전 렌더 루프 컴포넌트
    AFRAME.registerComponent('forced-rotator', {
      tick: function (time, timeDelta) {
        if (window.rotationSpeed > 0) {
          window.bgAngle += (window.rotationSpeed * 0.0004 * (timeDelta / 16.66));
          this.el.object3D.rotation.y = window.bgAngle;
        }
      }
    });
  </script>
</head>
<body>

  <div id="control-panel">
    <div class="panel-title">👁️ 양안시 통합 재활 설정 V9.34</div>
    
    <div class="panel-group">
      <label>🎯 재활 훈련 모드 선택</label>
      <select id="training-mode-select" class="mode-selector">
        <option value="convergence" selected>내사시/폭주 부족 (눈 모으기)</option>
        <option value="divergence">외사시/개산 부족 (눈 풀기)</option>
      </select>
    </div>

    <div class="panel-group">
      <label>⏰ 훈련 시간 설정</label>
      <select id="training-time-select">
        <option value="60">1분 (테스트용)</option>
        <option value="180">3분 (표준 치료)</option>
        <option value="300">5분 (정밀 집중)</option>
      </select>
    </div>
    <div class="panel-group">
      <label>↕️ 기본 양안시차 간격(Gap) <span class="display-value" id="separation-txt">0.15</span></label>
      <input type="range" id="separation-slider" min="0.00" max="1.50" value="0.15" step="0.05">
    </div>
    <div class="panel-group">
      <label>🔄 배경 회전 속도 <span class="display-value" id="bg-speed-txt">4</span></label>
      <input type="range" id="bg-speed-slider" min="0" max="30" value="4" step="1">
    </div>
    <button id="start-btn" class="btn" onclick="startFusionTraining()">▶️ 선택 모드 재활 시작</button>
  </div>

  <div id="score-board">
    <div style="color: #ef4444; font-size: 17px; margin-bottom: 5px; font-weight:bold;">TIME: <span id="val-time">00:00</span></div>
    <div>SCORE: <span id="val-score">0000</span></div>
    <div style="color: #38bdf8; font-size: 13px; margin-top: 4px;">CURRENT GAP: <span id="val-gap">0.15</span></div>
    <div id="status-txt" style="color: #eab308; font-size: 12px; margin-top: 4px; font-weight:bold;">진입 버튼을 누르세요.</div>
    <button id="exit-vr-control" class="exit-vr-btn" onclick="exitVRModeManually()">🔴 훈련 중단 및 복귀</button>
  </div>

  <div id="result-modal">
    <h1>🎉 융합 재활 완료 🎉</h1>
    <p style="color: #aaa; margin: 0;">최종 융합 유지 점수</p>
    <div class="final-score"><span id="modal-final-score">0</span> 점</div>
    <p style="color: #38bdf8; margin-bottom: 25px; font-size: 14px;">최종 도달 시차(Gap): <span id="modal-final-gap">0.15</span></p>
    <button class="reset-btn" onclick="location.reload()">처음으로</button>
  </div>

  <a-scene background="color: #060b19" vr-mode-ui="enabled: true">
    
    <a-entity id="cameraRig" position="0 0 0">
      <a-entity id="mainCamera" camera look-controls="pointerLockEnabled: false" position="0 0 0">
        <a-ring radius-inner="0.015" radius-outer="0.022" color="#ffffff" position="0 0 -1" material="shader: flat; opacity: 0.6; depthTest: false;"></a-ring>
        <a-entity id="centerFixationRay" raycaster="objects: .fusion-target-zone; far: 12; interval: 50;"></a-entity>
      </a-entity>
    </a-entity>

    <a-entity id="forced-universe-sphere" geometry="primitive: sphere; radius: 25;" material="shader: flat; color: #050a18; side: back;" forced-rotator stereo-eye-lock="eye: both">
      <a-sphere radius="0.05" material="color: #38bdf8; shader: flat;" position="3 2 -10"></a-sphere>
      <a-sphere radius="0.05" material="color: #ffffff; shader: flat;" position="-4 -2 -12"></a-sphere>
      <a-sphere radius="0.05" material="color: #a855f7; shader: flat;" position="5 -3 -15"></a-sphere>
    </a-entity>

    <a-entity id="magic-eye-board" visible="true" position="0 0 0">
      <a-entity id="left-eye-container" stereo-eye-lock="eye: left">
        <a-sphere id="balloon-left" color="#ff2a2a" material="roughness: 0.2; metalness: 0.1;">
          <a-cone id="cone-left" radius-top="0.005" color="#b30000"></a-cone>
        </a-sphere>
      </a-entity>
      
      <a-entity id="right-eye-container" stereo-eye-lock="eye: right">
        <a-sphere id="balloon-right" color="#ff2a9d" material="roughness: 0.2; metalness: 0.1;">
          <a-cone id="cone-right" radius-top="0.005" color="#b30066"></a-cone>
        </a-sphere>
      </a-entity>
      
      <a-entity id="fusion-collision-trigger" class="fusion-target-zone" geometry="primitive: sphere; radius: 0.18" material="visible: false;" stereo-eye-lock="eye: both"></a-entity>
    </a-entity>

    <a-entity id="particle-group"></a-entity>
  </a-scene>

  <script>
    window.rotationSpeed = 4; 
    window.bgAngle = 0; 
    
    let audioCtx = null; let score = 0; let separationDistance = 0.15; 
    let isTrainingActive = false; let isPopping = false; let currentMode = "convergence";

    let failureTimer = null; const FAILURE_THRESHOLD_TIME = 8000; 
    let elapsedInterval = null; let totalSecondsElapsed = 0; let targetSeconds = 180;      
    
    let boardX = 0, boardY = 0; 
    const GAP_SCALE_FACTOR = 0.35; 

    function getNormalizedZ() { 
      if (currentMode === "divergence") {
        return -4.0 - (separationDistance * 1.2); 
      }
      return -4.0;
    }

    document.getElementById('separation-slider').addEventListener('input', (e) => {
      separationDistance = parseFloat(e.target.value); updateUI();
      if(isTrainingActive) { renderMagicEyeElements(); }
    });
    document.getElementById('bg-speed-slider').addEventListener('input', (e) => {
      window.rotationSpeed = parseInt(e.target.value);
      document.getElementById('bg-speed-txt').innerText = window.rotationSpeed;
    });

    function updateUI() {
      document.getElementById('val-gap').innerText = separationDistance.toFixed(2);
      document.getElementById('separation-slider').value = separationDistance;
      document.getElementById('separation-txt').innerText = separationDistance.toFixed(2);
    }

    function renderMagicEyeElements() {
      if (!isTrainingActive) return;

      let directionSign = (currentMode === "divergence") ? -1 : 1;
      let calculatedGap = separationDistance * GAP_SCALE_FACTOR * directionSign; 
      let targetZ = getNormalizedZ(); 
      let dynamicRadius = 0.18;

      const bLeft = document.getElementById('balloon-left');
      const bRight = document.getElementById('balloon-right');
      const cLeft = document.getElementById('cone-left');
      const cRight = document.getElementById('cone-right');
      const triggerZone = document.getElementById('fusion-collision-trigger');

      bLeft.setAttribute('position', `${boardX - calculatedGap} ${boardY} ${targetZ}`);
      bLeft.setAttribute('radius', dynamicRadius);
      cLeft.setAttribute('position', `0 ${-dynamicRadius * 1.1} 0`);
      cLeft.setAttribute('radius-bottom', `${dynamicRadius * 0.12}`);
      cLeft.setAttribute('height', `${dynamicRadius * 0.22}`);

      bRight.setAttribute('position', `${boardX + calculatedGap} ${boardY} ${targetZ}`);
      bRight.setAttribute('radius', dynamicRadius);
      cRight.setAttribute('position', `0 ${-dynamicRadius * 1.1} 0`);
      cRight.setAttribute('radius-bottom', `${dynamicRadius * 0.12}`);
      cRight.setAttribute('height', `${dynamicRadius * 0.22}`);

      if (triggerZone) {
        triggerZone.setAttribute('position', `${boardX} ${boardY} ${targetZ}`);
        if(!isPopping && !triggerZone.classList.contains('fusion-target-zone')) {
          triggerZone.classList.add('fusion-target-zone');
        }
      }
    }

    function setupVRHardwareLayers() {
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('enter-vr', () => {
        const camera = sceneEl.camera;
        if (camera && camera.isArrayCamera) {
          camera.cameras[0].layers.enable(1); camera.cameras[0].layers.disable(2);
          camera.cameras[1].layers.enable(2); camera.cameras[1].layers.disable(1);
        }
        isTrainingActive = true;
        renderMagicEyeElements();
      });
    }

    function checkMagicEyeFixation() {
      requestAnimationFrame(checkMagicEyeFixation);
      if (!isTrainingActive || isPopping) return; 

      const raycasterEl = document.getElementById('centerFixationRay');
      if (!raycasterEl) return;

      let raycasterComponent = raycasterEl.components.raycaster;
      if (raycasterComponent && raycasterComponent.intersections && raycasterComponent.intersections.length > 0) {
        const triggerZone = document.getElementById('fusion-collision-trigger');
        if (triggerZone) { triggerZone.classList.remove('fusion-target-zone'); }
        isPopping = true; 
        popMagicEyeSuccess();
      }
    }

    function popMagicEyeSuccess() {
      const board = document.getElementById('magic-eye-board');
      stopFailureTimer(); playPopSound(); 
      score += 1000;
      document.getElementById('val-score').innerText = score.toString().padStart(4, '0');

      let targetZ = getNormalizedZ();
      triggerParticlesEmission(boardX, boardY, targetZ, 30);

      separationDistance += 0.05; 
      if (separationDistance > 1.50) separationDistance = 1.50;
      updateUI();

      board.setAttribute('visible', 'false');
      
      setTimeout(() => {
        if (!isTrainingActive) return;
        boardX = (Math.random() - 0.5) * 0.3;
        boardY = (Math.random() - 0.5) * 0.3;
        isPopping = false;
        renderMagicEyeElements(); 
        board.setAttribute('visible', 'true'); 
        resetFailureTimer(); 
      }, 1200);
    }

    function startElapsedClock() {
      if (elapsedInterval) clearInterval(elapsedInterval);
      totalSecondsElapsed = 0;
      elapsedInterval = setInterval(() => {
        if (!isTrainingActive) return;
        totalSecondsElapsed++;
        let min = Math.floor(totalSecondsElapsed / 60); let sec = totalSecondsElapsed % 60;
        document.getElementById('val-time').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        if (totalSecondsElapsed >= targetSeconds) { clearInterval(elapsedInterval); finishTrainingSession(); }
      }, 1000);
    }

    function resetFailureTimer() {
      if (!isTrainingActive) return;
      if (failureTimer) clearTimeout(failureTimer);
      
      if(currentMode === "divergence") {
        document.getElementById('status-txt').innerText = "🔵 [개산] 초점을 멀리 풀어 풍선을 합치세요!";
      } else {
        document.getElementById('status-txt').innerText = "🟢 [폭주] 시선을 중앙으로 모아 풍선을 합치세요!";
      }
      document.getElementById('status-txt').style.color = "#38bdf8";
      
      failureTimer = setTimeout(() => {
        if (separationDistance <= 0.1) { resetFailureTimer(); return; }
        separationDistance -= 0.05; 
        if (separationDistance < 0.0) separationDistance = 0.0;
        updateUI();
        document.getElementById('status-txt').innerText = "📉 융합 정체: 난이도 역피드백 조절";
        document.getElementById('status-txt').style.color = "#f43f5e";
        renderMagicEyeElements();
        resetFailureTimer();
      }, FAILURE_THRESHOLD_TIME);
    }

    function stopFailureTimer() { if (failureTimer) clearTimeout(failureTimer); }

    function playPopSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(147.14, audioCtx.currentTime + 0.15);
      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gainNode); gainNode.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.18);
    }

    function triggerParticlesEmission(x, y, z, count) {
      const pGroup = document.getElementById('particle-group');
      for (let i = 0; i < count; i++) {
        const p = document.createElement('a-box');
        p.setAttribute('width', '0.03'); p.setAttribute('height', '0.03'); p.setAttribute('depth', '0.03');
        const colors = ['#ff2a2a', '#ff2a9d', '#38bdf8', '#eab308'];
        p.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]); p.setAttribute('position', `${x} ${y} ${z}`);
        const vx = (Math.random() - 0.5) * 3; const vy = (Math.random() - 0.5) * 3 + 1.0; const vz = (Math.random() - 0.5) * 3;
        pGroup.appendChild(p);
        let age = 0;
        const t = setInterval(() => {
          age += 16;
          let cx = x + vx * (age/1000); let cy = y + vy * (age/1000) - (0.5 * 9.8 * (age/1000)*(age/1000)); let cz = z + vz * (age/1000);
          p.setAttribute('position', `${cx} ${cy} ${cz}`);
          if (age > 800) { clearInterval(t); if (p.parentNode) p.parentNode.removeChild(p); }
        }, 16);
      }
    }

    function finishTrainingSession() {
      isTrainingActive = false; stopFailureTimer(); isPopping = false;
      document.getElementById('magic-eye-board').setAttribute('visible', 'false');
      document.getElementById('exit-vr-control').style.display = 'none';
      setTimeout(() => {
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.is('vr-mode')) sceneEl.exitVR();
        document.getElementById('modal-final-score').innerText = score;
        document.getElementById('modal-final-gap').innerText = separationDistance.toFixed(2);
        document.getElementById('result-modal').style.display = 'block';
      }, 800);
    }

    function exitVRModeManually() {
      isTrainingActive = false; stopFailureTimer(); isPopping = false;
      if (elapsedInterval) clearInterval(elapsedInterval);
      document.getElementById('magic-eye-board').setAttribute('visible', 'false');
      document.getElementById('control-panel').style.display = 'block';
      document.getElementById('exit-vr-control').style.display = 'none';
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl && sceneEl.is('vr-mode')) sceneEl.exitVR();
    }

    function startFusionTraining() {
      currentMode = document.getElementById('training-mode-select').value;
      targetSeconds = parseInt(document.getElementById('training-time-select').value);
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      document.getElementById('control-panel').style.display = 'none';
      document.getElementById('exit-vr-control').style.display = 'block';
      
      boardX = 0; boardY = 0;
      document.getElementById('magic-eye-board').setAttribute('visible', 'true');
      
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl.hasLoaded) { 
        sceneEl.enterVR(); 
        isTrainingActive = true;
        renderMagicEyeElements(); 
        resetFailureTimer(); 
        startElapsedClock();
      } else { 
        sceneEl.addEventListener('loaded', () => { 
          sceneEl.enterVR(); 
          isTrainingActive = true;
          renderMagicEyeElements(); 
          resetFailureTimer(); 
          startElapsedClock();
        }); 
      }
    }

    setupVRHardwareLayers();
    requestAnimationFrame(checkMagicEyeFixation);
  </script>
</body>
</html>
